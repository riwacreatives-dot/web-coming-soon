<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Riwa Creatives is an independent creative and growth studio bringing together branding, commercial advertising, digital marketing and technology to help ambitious businesses build distinctive brands and experiences." />
    <meta name="keywords" content="creative agency India, branding and design studio, commercial advertising agency, brand identity design, digital marketing and creative agency, website design and development, advertising campaign production, creative studio for startups, Riwa Creatives, Ranjan Kumar" />
    <meta name="author" content="RIWA CREATIVES" />
    <meta name="theme-color" content="#111116" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/riwa-r-logo.svg" />
    <link rel="apple-touch-icon" href="/brand/riwa-r-logo.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RIWA CREATIVES" />
    <meta property="og:url" content="https://riwacreatives.in" />
    <meta property="og:title" content="Riwa Creatives — Making Unreasonable Brands Happen" />
    <meta property="og:description" content="We turn ambitious ideas into distinctive identities, disruptive campaigns and digital experiences. Making unreasonable brands happen." />
    <meta property="og:image" content="https://riwacreatives.in/work/solanas-chilli-chicken.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@riwacreatives" />
    <meta name="twitter:creator" content="@riwacreatives" />
    <meta name="twitter:title" content="Riwa Creatives — Making Unreasonable Brands Happen" />
    <meta name="twitter:description" content="We turn ambitious ideas into distinctive identities, disruptive campaigns and digital experiences. Making unreasonable brands happen." />
    <meta name="twitter:image" content="https://riwacreatives.in/work/solanas-chilli-chicken.jpg" />

    <!-- Performance: Preload Critical Hero Asset -->
    <link rel="preload" href="/work/solanas-chilli-chicken.jpg" as="image" fetchpriority="high" />

    <!-- Google Fonts: Instrument Serif, Syne, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Syne:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Riwa Creatives — Independent Creative &amp; Growth Studio</title>

    <!-- JSON-LD Structured Entity Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RIWA CREATIVES",
        "alternateName": "RIWA",
        "url": "https://riwacreatives.vercel.app",
        "logo": "https://riwacreatives.vercel.app/brand/riwa-r-logo.svg",
        "description": "Next-generation commercial ad art studio & performance marketing growth engine scaling category-defining brands.",
        "founder": {
          "@type": "Person",
          "name": "Ranjan Kumar",
          "jobTitle": "Founder & Creative Director"
        },
        "sameAs": [
          "https://instagram.com/madebyriwa"
        ]
      }
    </script>
    <script>
      if (typeof window !== 'undefined') {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
      }
    </script>
  </head>
  <body class="bg-canvas text-text-primary antialiased selection:bg-brand-red selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
