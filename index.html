<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwa — We Are Almost Ready to Launch!</title>
  <meta name="description" content="Riwa is coming soon. Something extraordinary is being crafted — creative, bold, and built to inspire." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --orange: #FF6B2B;
      --orange-soft: #FF9458;
      --dark: #0e0b08;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.55);
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--dark);
      color: var(--white);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    /* ── Animated Background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 20% 15%, rgba(255, 107, 43, 0.16) 0%, transparent 65%),
        radial-gradient(ellipse 55% 45% at 82% 78%, rgba(255, 120, 60, 0.12) 0%, transparent 58%),
        linear-gradient(175deg, #1b1008 0%, #0e0b08 55%, #140d06 100%);
      animation: bgBreath 9s ease-in-out infinite alternate;
      transition: transform 0.2s cubic-bezier(0.1, 0, 0.2, 1);
      pointer-events: none;
    }

    @keyframes bgBreath {
      0%   { filter: brightness(1); }
      100% { filter: brightness(1.08); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      animation: orbDrift 14s ease-in-out infinite alternate;
    }
    .orb1 {
      width: 500px; height: 500px;
      top: -160px; left: -140px;
      background: radial-gradient(circle, rgba(255, 107, 43, 0.22) 0%, transparent 70%);
      animation-duration: 16s;
    }
    .orb2 {
      width: 380px; height: 380px;
      bottom: -100px; right: -100px;
      background: radial-gradient(circle, rgba(255, 140, 85, 0.16) 0%, transparent 70%);
      animation-duration: 11s;
      animation-delay: -5s;
    }

    @keyframes orbDrift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(30px, 20px); }
    }

    /* ── Main Top Content ── */
    .top-area {
      position: relative;
      z-index: 10;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 24px 20px;
      text-align: center;
    }

    /* Real Riwa Logo */
    .logo-wrap {
      margin-bottom: 4px;
      animation: fadeUp 1s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .logo-img {
      height: clamp(220px, 30vh, 280px);
      width: auto;
      max-width: 420px;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(255, 107, 43, 0.6));
      transition: filter 0.4s ease, transform 0.4s ease;
      cursor: default;
      display: block;
      margin: 0 auto;
    }
    .logo-img:hover {
      filter: drop-shadow(0 0 50px rgba(255, 107, 43, 0.85));
      transform: translateY(-4px) scale(1.03);
    }

    /* Eyebrow badge */
    .eyebrow {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 0.85s 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Headline */
    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(36px, 5.8vw, 72px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeUp 1s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      background: linear-gradient(145deg, #ffffff 0%, #ffd4b3 48%, var(--orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(14px, 1.7vw, 17px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.65);
      max-width: 540px;
      line-height: 1.7;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.9s 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Bottom Creative / Studio Scene ── */
    .scene-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      flex-shrink: 0;
      height: 200px;
      overflow: hidden;
      margin-top: auto;
    }
    .scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .footer-text {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.22);
      white-space: nowrap;
      z-index: 20;
    }
    .footer-text span {
      color: rgba(255, 107, 43, 0.55);
    }

    @media (max-width: 640px) {
      .top-area { padding: 28px 18px 12px; }
      .logo-img { height: 130px; }
      .scene-wrap { height: 140px; }
    }
  </style>
</head>

    // Gentle mouse parallax
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth  - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 12;
      const bg = document.querySelector('.bg');
      if (bg) {
        bg.style.transform = `translate(${x * 0.28}px, ${y * 0.28}px) scale(1.03)`;
      }
    });
