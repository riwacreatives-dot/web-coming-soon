<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Riwa Creatives is an independent creative and growth studio uniting brand identity, creative advertising, digital technology, events, and ongoing growth."
    />
    <meta name="author" content="Riwa Creatives" />
    <meta name="theme-color" content="#F5F4F0" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/brand/riwa-logo-official.png" />
    <link rel="apple-touch-icon" href="/brand/riwa-logo-official.png" />
    <link rel="canonical" href="https://riwacreatives.in/" />

    <!-- Open Graph (Unapproved client images & missing AST-M04 OG card omitted until cleared) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Riwa Creatives" />
    <meta property="og:url" content="https://riwacreatives.in" />
    <meta property="og:title" content="Riwa Creatives — Independent Creative &amp; Growth Studio." />
    <meta
      property="og:description"
      content="Independent Creative &amp; Growth Studio — Brand &amp; Identity, Creative &amp; Advertising, Digital &amp; Technology, Events &amp; Experiences, and Brand Management &amp; Growth."
    />

    <!-- Twitter / X Summary (no unverified @handle or unapproved image) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Riwa Creatives — Independent Creative &amp; Growth Studio." />
    <meta
      name="twitter:description"
      content="Independent Creative &amp; Growth Studio uniting brand, advertising, digital, events, and growth."
    />

    <!-- Locked 4 Open-Source Typefaces (SIL OFL-1.1): Syne (400-800 upright), Instrument Serif (400), Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400..500;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..600&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <title>Riwa Creatives — Independent Creative &amp; Growth Studio</title>

    <!-- Schema.org Organization JSON-LD (DEC-11: verified fields only; zero placeholders) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Riwa Creatives",
        "url": "https://riwacreatives.in",
        "description": "Independent Creative & Growth Studio — Brand & Identity, Creative & Advertising, Digital & Technology, Events & Experiences, and Brand Management & Growth.",
        "founder": {
          "@type": "Person",
          "name": "Ranjan Kumar"
        }
      }
    </script>
  </head>
  <body class="bg-warm-white text-ink-black antialiased selection:bg-[#111116] selection:text-[#F5F4F0]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
